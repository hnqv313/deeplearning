[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-image-classification"
version = "0.1.0"
description = "Reproducible class-incremental image classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
]

[project.optional-dependencies]
data = ["fiftyone>=1.0", "graphql-core>=3.2,<3.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
