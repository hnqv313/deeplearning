project_name: continual-image-classification-smoke-vit
seed: 42
device: cpu

data:
  train_manifest: data/manifests/pilot/train.csv
  val_manifest: data/manifests/pilot/val.csv
  test_manifest: data/manifests/pilot/test.csv
  image_size: 224
  num_workers: 0
  class_order: [dog, cat, car, person, building]
  stages:
    - [dog, cat]
    - [car]
    - [person]
    - [building]

model:
  backbone: vit_tiny_patch16_224
  pretrained: true
  num_classes: 5
  dropout: 0.0

training:
  batch_size: 5
  epochs_stage0: 1
  epochs_incremental: 1
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.05
  amp: false
  reset_optimizer_each_stage: true

evaluation:
  seeds: [42]
  save_checkpoints: false
  output_dir: outputs/smoke_vit
