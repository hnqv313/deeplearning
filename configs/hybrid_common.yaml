# Common configuration for the Replay + NCM hybrid on the ImageNet-21k backbone.
#
# Identical to `configs/common.yaml` except for `evaluation.output_dir`. The hybrid must
# not write into the published `outputs/` tree: the next `summarize_results.py` run there
# would rewrite the committed 6-method CSVs with 7 methods, which breaks
# `scripts/plot_final_results.py` and the reproducibility of the published results.
project_name: continual-image-classification-hybrid
seed: 42
device: auto

data:
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  image_size: 224
  num_workers: 0
  class_order: [dog, cat, car, person, building]
  stages:
    - [dog, cat]
    - [car]
    - [person]
    - [building]

model:
  backbone: vit_tiny_patch16_224
  pretrained: true
  num_classes: 5
  dropout: 0.0

training:
  batch_size: 32
  epochs_stage0: 20
  epochs_incremental: 15
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.05
  amp: true
  reset_optimizer_each_stage: true

evaluation:
  seeds: [42, 123, 2026]
  save_checkpoints: true
  output_dir: outputs/hybrid
